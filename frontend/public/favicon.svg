<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Hard Offset Sketch Shadow -->
  <rect x="7" y="7" width="50" height="50" rx="8" fill="#09090b" opacity="0.35"/>

  <!-- High-Contrast Architectural Badge Surface -->
  <rect x="4" y="4" width="50" height="50" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>

  <!-- Precision Architectural 'W' Geometric Structure -->
  <polyline points="13 18 21 42 29 26 37 42 45 18" 
            stroke="#ffffff" 
            stroke-width="4" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            fill="none"/>

  <!-- Dashed Drafting Plumb Line -->
  <line x1="29" y1="26" x2="29" y2="15" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        stroke-dasharray="2 2" 
        stroke-linecap="round"/>

  <!-- Crest Focal Point / Compass Node -->
  <circle cx="29" cy="14" r="2.75" fill="#ffffff"/>
</svg>