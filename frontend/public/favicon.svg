<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Left Flow Ribbon (Violet to Indigo) -->
    <linearGradient id="leftRibbon" x1="12" y1="18" x2="34" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Right Flow Ribbon (Indigo to Cyan) -->
    <linearGradient id="rightRibbon" x1="28" y1="20" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Center Loop Overlay -->
    <linearGradient id="centerLoop" x1="26" y1="18" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Inner Subtle Glow Ring -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- WisdomFlow Fluid "W" Icon Symbol -->
  <g filter="url(#glow)">
    <!-- Left outer arm -->
    <path d="M16 22 C 16 36, 21 44, 27 44 C 30 44, 32 38, 32 29" 
          stroke="url(#leftRibbon)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Left inner diagonal loop -->
    <path d="M21 28 C 21 38, 25 44, 29 44 C 32 44, 34 38, 34 26 C 34 20, 31 18, 29 20 C 27 22, 26 27, 26 33" 
          stroke="url(#leftRibbon)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>

    <!-- Right inner loop & diagonal -->
    <path d="M30 20 C 33 17, 36 20, 36 26 C 36 36, 38 44, 42 44 C 47 44, 49 37, 49 28" 
          stroke="url(#rightRibbon)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>

    <!-- Right outer arm -->
    <path d="M32 29 C 32 38, 35 44, 38 44 C 44 44, 49 36, 49 22" 
          stroke="url(#rightRibbon)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Center crest / focal connection loop -->
    <path d="M28 24 C 29 19, 35 19, 36 24 C 36 30, 33 36, 32 39" 
          stroke="url(#centerLoop)" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Neural Sparks / Glowing Nodes -->
  <!-- Node 1: Top-Left Spark -->
  <circle cx="16" cy="22" r="3.2" fill="#c084fc"/>
  <circle cx="16" cy="22" r="1.5" fill="#ffffff"/>

  <!-- Node 2: Mid-Left Spark -->
  <circle cx="21" cy="28" r="2.8" fill="#a855f7"/>
  <circle cx="21" cy="28" r="1.2" fill="#ffffff"/>

  <!-- Node 3: Mid-Right Spark -->
  <circle cx="49" cy="28" r="2.8" fill="#22d3ee"/>
  <circle cx="49" cy="28" r="1.2" fill="#ffffff"/>

  <!-- Node 4: Top-Right Spark -->
  <circle cx="49" cy="22" r="3.2" fill="#38bdf8"/>
  <circle cx="49" cy="22" r="1.5" fill="#ffffff"/>
</svg>