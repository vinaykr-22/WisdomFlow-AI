<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WisdomFlow Clipper</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      width: 320px;
      margin: 0;
      padding: 0;
      color: #0f172a;
      background: #f8fafc;
    }
    .header {
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      padding: 16px 20px;
      color: white;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }
    h1 {
      font-size: 18px;
      font-weight: 800;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .container {
      padding: 0 20px 20px 20px;
    }
    .status {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      display: none;
    }
    .status.success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
      display: block;
    }
    .status.error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
      display: block;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
      outline: none;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 8px -1px rgba(0, 0, 0, 0.1), 0 4px 6px -1px rgba(0, 0, 0, 0.06);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled {
      background: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-secondary {
      background: white;
      color: #475569;
      border: 1px solid #cbd5e1;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      margin-top: 12px;
    }
    .btn-secondary:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .auth-section { display: block; }
    .clip-section { display: none; }
    
    /* Dark Mode Theme */
    body.dark {
      background: #0f172a;
      color: #f8fafc;
    }
    body.dark .header {
      background: linear-gradient(135deg, #1e3a8a 0%, #4c1d95 100%);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }
    body.dark label {
      color: #94a3b8;
    }
    body.dark input[type="text"], body.dark input[type="password"] {
      background: #1e293b;
      border-color: #334155;
      color: #f8fafc;
    }
    body.dark input[type="text"]:focus, body.dark input[type="password"]:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
    }
    body.dark .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border-color: #334155;
    }
    body.dark .btn-secondary:hover {
      background: #334155;
      color: #f8fafc;
    }
    body.dark .status.error {
      background-color: #450a0a;
      color: #fecaca;
      border-color: #7f1d1d;
    }
    body.dark .status.success {
      background-color: #052e16;
      color: #bbf7d0;
      border-color: #14532d;
    }
    
    /* Logo Icon SVG */
    .logo-icon {
      width: 24px;
      height: 24px;
    }
    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .theme-toggle {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
      padding: 0;
      box-shadow: none;
    }
    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <h1>
        <svg class="logo-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
        WisdomFlow AI
      </h1>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
        <svg id="moonIcon" style="display: block;" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
        <svg id="sunIcon" style="display: none;" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
      </button>
    </div>
  </div>
  
  <div class="container">
    <div id="status" class="status"></div>

    <div id="authSection" class="auth-section">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <button id="loginBtn">Login</button>
    </div>

    <div id="clipSection" class="clip-section">
      <div class="form-group">
        <label for="docTitle">Document Title</label>
        <input type="text" id="docTitle" placeholder="Title for the clipped page...">
      </div>
      <button id="clipBtn">Clip This Page</button>
      <button id="logoutBtn" class="btn-secondary">Logout</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
